[build]
  # Se il controllo trova errori (link rotti, parole vietate…) la pubblicazione si ferma.
  # Al passaggio al dominio vero, aggiungere "-- --pubblicazione" al check:
  # da lì anche i segnaposto [IN SOSPESO: …] fermano la pubblicazione.
  command = "npm test && npm run build && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# (opzionale) redirect base per sicurezza, se mai userai una SPA
#[[redirects]]
#  from = "/*"
#  to = "/index.html"
#  status = 200
